services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # Use development stage for local development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - REACT_APP_SCOUTING_API_URL=http://localhost:8001/api
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    depends_on:
      - backend
      - scouting-service
    networks:
      - app-network
    restart: unless-stopped

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/videodb
      - SECRET_KEY=your_secret_key_here_change_in_production
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_URL=minio:9000
      - MINIO_BUCKET=videos
      - PYTHONPATH=/app
      - SCOUTING_SERVICE_URL=http://scouting-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - minio
    networks:
      - app-network
    restart: unless-stopped

  # Scouting Report Service with CPU-only packages
  scouting-service:
    build:
      context: ./scouting-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/scoutingdb
      - SECRET_KEY=your_secret_key_here_change_in_production
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_URL=minio:9000
      - MINIO_BUCKET=reports
      - PYTHONPATH=/app
      - MAIN_BACKEND_URL=http://backend:8000
      # CPU-only optimization environment variables
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    ports:
      - "8001:8001"
    volumes:
      - ./scouting-service:/app
    depends_on:
      - db
      - minio
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=videodb
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  # MinIO Storage Service
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
      - MINIO_DOMAIN=localhost
      - MINIO_CORS_ALLOW_ALL=true
      - MINIO_BROWSER=on
      - MINIO_REGION=us-east-1
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console port
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped

  # MinIO Client for bucket setup
  mc:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10 &&
      echo 'Setting up MinIO buckets...' &&
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/videos &&
      mc mb --ignore-existing myminio/reports &&
      mc anonymous set download myminio/videos &&
      mc anonymous set download myminio/reports &&
      echo 'MinIO setup completed successfully!' &&
      exit 0;
      "
    networks:
      - app-network

# Network configuration
networks:
  app-network:
    driver: bridge

# Volume configuration
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

